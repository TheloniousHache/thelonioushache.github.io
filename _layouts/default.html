<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr' }}">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} · {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

</head>


<body>

  <!-- =====================================================
       Header
       ===================================================== -->

  <header class="site-header">

    <div class="site-header-inner">

      <div class="brand">

        <a class="brand-link" href="{{ '/' | relative_url }}">

          <!-- Même logo que le favicon -->
          <img
            class="logo-mark"
            src="{{ '/assets/images/favicon.svg' | relative_url }}"
            alt=""
            aria-hidden="true"
          >

          <div class="brand-text">

            <div class="site-title">
              <span class="site-title-blue">Énergie en</span>
              <span class="site-title-green">Perspective</span>
            </div>

            <div class="site-description">
              Politiques publiques <span class="separator">·</span>
              Industrie <span class="separator">·</span>
              Systèmes énergétiques
            </div>

          </div>

        </a>

      </div>


      <nav class="site-nav" aria-label="Navigation principale">

        <a href="{{ '/' | relative_url }}">
          Accueil
        </a>

        <a href="{{ '/articles/' | relative_url }}">
          Articles
        </a>

        <a href="{{ '/about/' | relative_url }}">
          À propos
        </a>

      </nav>

    </div>

  </header>


  <!-- =====================================================
       Main content
       ===================================================== -->

  <main class="site-main">

    {{ content }}

  </main>


  <!-- =====================================================
       Footer
       ===================================================== -->

  <footer class="site-footer">

    <div class="footer-inner">

      <span class="copyright">
        © {{ 'now' | date: "%Y" }} {{ site.author }}
      </span>


      <a
        class="linkedin-link"
        href="https://www.linkedin.com/in/thelonious-hache/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Profil LinkedIn de Thélonious Hache"
      >

        <img
          class="linkedin-icon"
          src="{{ '/assets/images/linkedin-logo-deep-blue.png' | relative_url }}"
          alt=""
          aria-hidden="true"
        >

      </a>

    </div>

  </footer>


</body>

</html>
