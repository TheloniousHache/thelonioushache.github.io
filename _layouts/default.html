<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr' }}">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} · {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

</head>


<body>

  <!-- =====================================================
       Header
       ===================================================== -->

  <header class="site-header">

    <div class="site-header-inner">

      <div class="brand">

        <a class="brand-link" href="{{ '/' | relative_url }}">

          <!-- Même logo que le favicon -->
          <img
            class="logo-mark"
            src="{{ '/assets/images/favicon.svg' | relative_url }}"
            alt=""
            aria-hidden="true"
          >

          <div class="brand-text">

            <div class="site-title">
              <span class="site-title-blue">Énergie en</span>
              <span class="site-title-green">Perspective</span>
            </div>

            <div class="site-description">
              Politiques publiques <span class="separator">·</span>
              Industrie <span class="separator">·</span>
              Systèmes énergétiques
            </div>

          </div>

        </a>

      </div>


      <nav class="site-nav" aria-label="Navigation principale">

        <a href="{{ '/' | relative_url }}">
          Accueil
        </a>

        <a href="{{ '/articles/' | relative_url }}">
          Articles
        </a>

        <a href="{{ '/about/' | relative_url }}">
          À propos
        </a>

      </nav>

    </div>

  </header>


  <!-- =====================================================
       Main content
       ===================================================== -->

  <main class="site-main">

    {{ content }}

  </main>


  <!-- =====================================================
       Footer
       ===================================================== -->

  <footer class="site-footer">

    <div class="footer-inner">

      <span class="copyright">
        © {{ 'now' | date: "%Y" }} {{ site.author }}
      </span>


      <a
        class="linkedin-link"
        href="https://www.linkedin.com/in/thelonious-hache/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Profil LinkedIn de Thélonious Hache"
      >

        <!-- Logo LinkedIn officiel : carré + "in" -->
        <svg
          class="linkedin-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect x="0" y="0" width="24" height="24" rx="2.5" fill="currentColor"/>

          <path
            d="M6.2 8.1H3.6V20h2.6V8.1ZM4.9 4C4.05 4 3.35 4.7 3.35 5.55S4.05 7.1 4.9 7.1s1.55-.7 1.55-1.55S5.75 4 4.9 4ZM20.65 13.15c0-3.58-1.91-5.25-4.46-5.25-2.06 0-2.98 1.13-3.49 1.92V8.1h-2.6V20h2.6v-5.88c0-1.55.29-3.05 2.21-3.05 1.9 0 1.92 1.77 1.92 3.15V20h2.6l.01-6.85Z"
            fill="#ffffff"
          />
        </svg>

      </a>

    </div>

  </footer>


</body>

</html>
